spring.application.name=workitem-service

server.port=8093
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register by IP: the machine hostname is not resolvable by the gateway's Netty DNS resolver
eureka.instance.prefer-ip-address=true

# Tenant DBs share one MySQL instance; only the database name differs (tenant_{tenantId without dashes}).
# Tenant databases are created and migrated by auth-service at onboarding, never by this service.
spring.datasource.tenant.host=localhost
spring.datasource.tenant.port=3306
spring.datasource.tenant.username=root
spring.datasource.tenant.password=${MASTER_DB_ROOT_PASSWORD:password}
spring.datasource.tenant.max-pool-size=5

# The tenant is only known per request, so nothing may open a connection while the application starts: tell Hibernate
# the dialect instead of letting it ask the database, and keep Boot from probing the DataSource.
spring.jpa.database=mysql
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# Columns are PascalCase (ProjectId) and declared with @Column(name): use the names exactly as written, not snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Same secret and issuer auth-service signs with. No default: the service refuses to start without it.
sprintmodus.jwt.secret=${JWT_SECRET:}
sprintmodus.jwt.issuer=sprintmodus-auth

# A slow project-service must not hold request threads (and tenant connections) for long: fail fast, the caller gets a 503
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Browser origins allowed to open the board WebSocket (comma-separated patterns). The gateway forwards the browser's Origin
sprintmodus.websocket.allowed-origins=http://localhost:4200
